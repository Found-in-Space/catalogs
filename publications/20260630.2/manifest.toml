format_version = 1
release = "20260630.2"
title = "Policy-neutral Gaia DR3-Hipparcos pairing evidence"
status = "draft"

[summary]
description = "Possible Gaia DR3-Hipparcos pairings and factual apparent-magnitude, radial-distance, astrometric, and neighbourhood evidence for later pipeline policy."

[scope]
records_possible_pairings_only = true
h2bn_is_authoritative_pairing_context = true
decides_duplicate_identity = false
decides_source_winner = false
decides_removal = false
constructs_merged_record = false
publishes_supplemental_map = false
consumer_contract = "Pipeline policy must separately decide pairing acceptance, row retention, source preference, field fusion, and overrides."

[zenodo]
status = "not_reserved"
resource_type = "dataset"
upload_policy = "readme-plus-path-preserving-publication-archive"

[inputs]
gaia_acquisition_record_doi = "10.5281/zenodo.21066981"
gaia_acquisition_record_url = "https://zenodo.org/records/21066981"
gaia_acquisition_package_id = "fis-gaia-dr3-full-20260627-b4db1f05-3e64bfe97038"
hipparcos_catalog = "Vizier I/311/hip2"
h2bn_catalog = "gaiadr3.hipparcos2_best_neighbour"
hipparcos2_neighbourhood_catalog = "gaiadr3.hipparcos2_neighbourhood"
catalogs_repository = "https://github.com/Found-in-Space/catalogs"
pipeline_repository = "https://github.com/Found-in-Space/pipeline"
pipeline_commit = "3e64bfe97038b4f62395601a2ccc6bca7ad44556"
raw_gaia_votable_payload_included = false
compact_gaia_parquet_included = false

[acquisition]
gaia_scope = "phot_g_mean_mag <= 15 in the controlled compact Gaia table"
local_scan_radius_arcsec = 5.0
automatic_magnitude_threshold = false
automatic_distance_threshold = false
absolute_magnitude_used = false
union_key = ["gaia_source_id", "hip_source_id"]
membership_flags = ["h2bn_pair", "local_scan_pair"]

[expected_counts]
pairing_rows = 124207
h2bn_rows = 99525
local_scan_rows = 122678
h2bn_local_overlap_rows = 97996
h2bn_only_rows = 1529
local_only_rows = 24682

[outputs]
pairing_evidence = "evidence/gaia_hip_pairing_evidence.parquet"
pairing_report = "evidence/gaia_hip_pairing_report.json"
support_input_provenance = "evidence/support_input_provenance.json"
gaia_match_table_summary = "evidence/gaia_raw_match_g15_summary.json"
gaia_acquisition_package = "evidence/gaia_acquisition_package.json"
gaia_download_state_summary = "evidence/gaia-download-state-summary.json"
gaia_download_queries_manifest = "evidence/gaia-download-queries-manifest.tsv"
gaia_votables_manifest = "evidence/gaia-votables-manifest.tsv"
gaia_votables_checksums = "evidence/gaia-votables.sha256"
gaia_acquisition_git_head = "evidence/gaia-acquisition-git-head.txt"
paper = "PAPER.md"
run_log = "run_log.md"
checksums = "checksums.sha256"
license = "LICENSE.txt"
notice = "NOTICE.md"
references = "REFERENCES.md"

[measurements]
apparent_magnitude_fields = [
  "gaia_g_mag",
  "hip_hp_mag",
  "gaia_g_minus_hip_hp_mag",
  "abs_gaia_g_minus_hip_hp_mag",
]
radial_fields = [
  "gaia_r_pc",
  "hip_r_pc",
  "radial_gap_pc",
  "combined_distance_sigma_pc",
  "radial_gap_sigma",
  "parallax_3d_separation_pc",
]
context_fields = [
  "h2bn_pair",
  "local_scan_pair",
  "gaia_candidate_count",
  "hip_candidate_count",
  "gaia_sky_neighbour_count",
  "hip_sky_neighbour_count",
  "one_to_one_candidate",
  "isolated_sky_pair",
  "h2bn_conflict",
  "in_hipparcos2_neighbourhood",
  "hipparcos2_neighbourhood_conflict",
]

[descriptive_bins]
radial_gap_pc = ["<=1", "1-3", "3-5", "5-10", ">10"]
absolute_apparent_magnitude_difference = ["<=0.5", "0.5-1", "1-2", ">2"]
policy_effect = "none"

[provenance]
created_by = "Found in Space"
updated_at = "2026-07-27"
exact_catalogs_commit = "Recorded by evidence/support_input_provenance.json during clean-worktree assembly."

[license]
found_in_space_original_material = "CC-BY-4.0"
upstream_terms_apply = true
summary = "Found in Space original publication material is CC BY 4.0; upstream Gaia, ESA, Hipparcos/Tycho, CDS/VizieR, and cited-source terms continue to apply."

[references]
gaia_mission = "Gaia Collaboration et al. 2016, A&A 595, A1, doi:10.1051/0004-6361/201629272"
gaia_dr3 = "Gaia Collaboration et al. 2023, A&A 674, A1, doi:10.1051/0004-6361/202243940"
gaia_crossmatch = "Marrese et al. 2019, A&A 621, A144, doi:10.1051/0004-6361/201834142"
hipparcos_new_reduction = "van Leeuwen 2007, A&A 474, 653-664, doi:10.1051/0004-6361:20078357"
vizier = "Ochsenbein et al. 2000, A&AS 143, 23-32, doi:10.1051/aas:2000169"
