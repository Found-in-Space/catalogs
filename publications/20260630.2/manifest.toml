gaia_dr1_crossmatch = "Marrese et al. 2017, A&A 605, A105, doi:10.1051/0004-6361/201629920"
gaia_dr2_crossmatch = "Marrese et al. 2019, A&A 621, A144, doi:10.1051/0004-6361/201834142"
hipparcos_new_reduction_validation = "van Leeuwen 2007, A&A 474, 653-664, doi:10.1051/0004-6361:20078357"
hipparcos_new_reduction_book = "van Leeuwen 2007, Hipparcos, the New Reduction of the Raw Data, Astrophysics and Space Science Library 350"
hipparcos_tycho_catalogues = "ESA 1997, The Hipparcos and Tycho Catalogues, ESA SP-1200"
