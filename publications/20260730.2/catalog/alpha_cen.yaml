description: >
  Three retained Alpha Centauri overrides from the original Found in Space
  override set, with their executable values and override IDs unchanged.
  Distances for Alpha Cen A/B use one system-level solution, coordinates use
  the pipeline J2016.0 epoch, and source-specific photometry quality flags are
  preserved. HIP numbers: A = 71683, B = 71681, Proxima = 70890.

  The current controlled Gaia DR3 hipparcos2_best_neighbour artifact maps
  Alpha Cen B and Proxima to HIP 71681 and HIP 70890 respectively. Alpha Cen A
  has no row in that artifact. These HIP-targeted replacements rely only on the
  normal published best-neighbour merge; no supplemental pairing is applied.

stars:
  - override_id: manual.alpha_cen_a.replace.v1
    action: replace
    source: hip
    source_id: 71683
    override_reason: binary_astrometry_photometry
    override_policy_version: kervella2016_j2016_v2

    ra_deg: 219.8685078441
    dec_deg: -60.8318787351
    r_pc: 1.3383835004

    mag_abs: 4.3771
    teff: 5792

    photometry_band: "Johnson V"
    photometry_quality: "C"
    photometry_value: 0.01
    identifiers:
      proper_name: Rigil Kentaurus
      hip_id: 71683
      hd: 128620
      bayer: alpha Cen
      constellation: Cen

    provenance:
      schema_version: 1
      review_status: retained_after_current_state_review
      legacy_source:
        repository: https://github.com/Found-in-Space/pipeline
        commit: 74635226a917ec4c2c1c08c46b38cd05d227732a
        path: src/foundinspace/pipeline/overrides/data/alpha_cen.yaml
        source_sha256: 8626f9a9f4a4550921108280a1092e0190503f4912a77549e1e50f228bbafb9f
        executable_values_changed: false
      position:
        epoch: J2016.0
        reference: "van Leeuwen 2007, A&A 474, 653; VizieR I/311"
        doi: 10.1051/0004-6361:20078357
        notes: "HIP 71683 astrometry propagated to the canonical epoch by the pinned Found in Space pipeline."
      selected_distance:
        value_pc: 1.3383835004
        symmetric_error_pc: 0.0010926749
        parallax_mas: 747.17
        parallax_error_mas: 0.61
        reference: "Kervella et al. 2016, A&A 594, A107"
        doi: 10.1051/0004-6361/201629201
        notes: "Reciprocal of the system parallax; the same distance is intentionally applied to Alpha Cen A and B."
      preserved_payload:
        apparent_magnitude: 0.01
        magnitude_rebase_formula: "mag_abs = apparent_mag - 5*log10(r_pc) + 5"
        photometry_reference: "SIMBAD Alpha Centauri A; Ducati 2002 VizieR II/237, bibcode 2002yCat.2237....0D"
        photometry_quality: "C"
        temperature_reference: "Heiter et al. 2015, A&A 582, A49"
        temperature_doi: 10.1051/0004-6361/201526319
        temperature_uncertainty_k: 16
      pairing:
        catalog: gaiadr3.hipparcos2_best_neighbour
        mapping_found: false
        evidence: evidence/alpha_cen_pairing_review.json

    notes: >
      Position is the pipeline-propagated Hipparcos position at the canonical
      J2016.0 epoch. Distance uses the Kervella et al. (2016) Alpha Cen system
      parallax and is applied to both A and B for binary consistency.
      Photometry is SIMBAD Johnson V from Ducati (2002), quality C; temperature
      is the Heiter et al. (2015) Gaia benchmark value.

